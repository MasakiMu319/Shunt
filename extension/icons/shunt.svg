<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Shunt</title>
  <desc id="desc">A simple bypass line on a paper-like extension icon.</desc>
  <defs>
    <filter id="paper-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6b5f4a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="22" fill="#f7f3ea" filter="url(#paper-shadow)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="21.5" fill="none" stroke="#e4dccd"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 66H100" stroke="#27313f" stroke-width="8"/>
    <path d="M34 66C43 42 85 42 94 66" stroke="#4f8f68" stroke-width="8"/>

    <circle cx="34" cy="66" r="9" fill="#f7f3ea" stroke="#27313f" stroke-width="6"/>
    <circle cx="64" cy="48" r="8" fill="#f7f3ea" stroke="#4f8f68" stroke-width="6"/>
    <circle cx="94" cy="66" r="9" fill="#f7f3ea" stroke="#27313f" stroke-width="6"/>
  </g>
</svg>
