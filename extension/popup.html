<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 280px; margin: 0; padding: 12px; font: 13px system-ui; color: #ddd; background: #1e1e2e; }
  h2 { margin: 0 0 8px; font-size: 14px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge-ok { background: #a6e3a1; color: #1e1e2e; }
  .badge-err { background: #f38ba8; color: #1e1e2e; }
  .section { margin: 10px 0; padding: 8px; background: #313244; border-radius: 6px; }
  .label { color: #bac2de; font-size: 11px; }
  .val { color: #cdd6f4; }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 3px 0; }
  .tab-url { font-size: 11px; color: #a6adc8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .attached { color: #a6e3a1; }
  button { width: 100%; padding: 6px; margin-top: 6px; border: none; border-radius: 4px; background: #585b70; color: #cdd6f4; cursor: pointer; font-size: 12px; }
  button:hover { background: #6c7086; }
</style>
</head>
<body>
<h2>Shunt</h2>
<div id="status">
  <div class="row"><span class="label">Extension</span><span class="badge badge-ok" id="ext">active</span></div>
  <div class="row"><span class="label">Native Host</span><span class="badge badge-err" id="host">—</span></div>
  <div class="row"><span class="label">Group Window</span><span class="val" id="win">—</span></div>
  <div class="row"><span class="label">Tab Group</span><span class="val" id="grp">—</span></div>
</div>
<div class="section">
  <div class="label" style="margin-bottom:4px">Attached Tabs</div>
  <div id="tabs"><span style="color:#6c7086">—</span></div>
</div>
<button id="refresh">Refresh</button>
<script src="popup.js"></script>
</body>
</html>
